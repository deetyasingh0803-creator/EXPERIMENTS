<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <fieldset>
        <form action="#">
            <h1>Hotel Room Booking Form</h1>
            <label for="name">Full Name:</label>
            <input type="text" name="text" id="text">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="mobile number">Phone:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="dob">Check-in Date:</label>
            <input type="Date" name="Date" id="Date">
            <br><br>
            <label for="dob">Check-out Date:</label>
            <input type="Date" name="Date" id="Date">
            <br><br>
            <label for="room">Room Type:</label>
            <select name="room" id="room">
                <option value="">Select</option>
                <option value="ac room">AC Rooms</option>
                <option value="non ac room">Non AC Rooms</option>
                <option value="double seater">Double Seater</option>
                <option value="triple seater">Triple Seater</option>
            </select>
            <br><br>
            <label for="">Number of Guests:</label>
            <input type="number" name="att" id="att">
            <br><br>
            <label for="rqusts">Special Requests:</label>
            <textarea name="rquts" id="rqusts"></textarea>
            <br><br>
            <input type="submit" value="Book Now">&nbsp;
            <input type="reset" value="Reset Form">
        </form>
    </fieldset>
    </center>
</body>
</html>
