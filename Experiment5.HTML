<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registraion Form</title>
</head>
<body>
    <fieldset>
            <form action="#">
                <center><h1>Student Registration Form</h1></center>
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" 
                placeholder="Enter your Name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" 
                placeholder="Enter your Email"required>
                <br><br>
                <label for="pass">Pssword:</label>
                <input type="password" name="pass" id="pass"
                placeholder="Enyer your Password" required>
                <br><br>
                <label for="gender">Gender:</label>
                <input type="radio" name="gender" id="gender">
                <label for="gender">Male</label>
                <input type="radio" name="gender" id="gender">
                <lable for="gender">Female</lable>
                <input type="radio" name="gender" id="gender">
                <label for="gender">Other</label>
                <br><br>
                <label for="course">Course:</label>
                <select name="course" id="course">
                    <option value=""> Select Course:</option>
                    <option value="btech">BTech</option>
                    <option value="bba">BBA</option>
                    <option value="ba">BA</option>
                    <option value="bca">BCA</option>
                </select>
                <br><br>
                <label for="add">Address:</label>
                <textarea name="add" id="add"></textarea required>
                <br><br>
                <input type="submit" value="Register">&nbsp;
                <input type="reset" value="Clear">
            </form>
    </fieldset>
</body>
</html>
